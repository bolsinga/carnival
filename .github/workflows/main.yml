name: push-and-prs-on-main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-carnival:
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v7
    - name: Switch to latest Xcode
      run: sudo xcode-select -s "/Applications/Xcode_27.0.app/Contents/Developer"
    - name: Build carnival
      run: xcodebuild -verbose -scheme carnival

  build-carnival-app:
    runs-on: xcode-27

    strategy:
      fail-fast: false
      matrix:
        destination:
          - 'platform=macOS'
          - 'generic/platform=iOS Simulator'
          - 'generic/platform=tvOS Simulator'
          - 'generic/platform=visionOS Simulator'

    steps:
    - uses: actions/checkout@v7
    - name: Switch to latest Xcode
      run: sudo xcode-select -s "/Applications/Xcode_27.0.app/Contents/Developer"
    - name: Install Metal Toolchain
      run: xcodebuild -downloadComponent MetalToolchain
    - name: Build CarnivalApp
      run: xcodebuild -verbose -scheme CarnivalApp -destination '${{ matrix.destination }}'
